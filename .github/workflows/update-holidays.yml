name: Update holidays

on:
  schedule:
    - cron: "23 4 1,15 * *"   # 每月 1 日和 15 日（UTC）
  workflow_dispatch:           # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch holidays
        run: node tools/update-holidays.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain holidays.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add holidays.json
            git commit -m "Update holidays.json"
            git push
          fi
