<!DOCTYPE html>
<html lang="zh-Hant" data-pal="2"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生活日誌</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111315;--sub:#4b5563;--line:#e3e6ea;--accent:#1f3864;--chip:#e8edf6;--warn:#8a5a00;--bad:#c0392b;--mark:#ffe58a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1b1e23;--text:#f4f5f7;--sub:#bcc2cc;--line:#2c3037;--accent:#8fb0f0;--chip:#252a33;--warn:#f0c060;--bad:#ff8f80;--mark:#7a6a1c}}
:root[data-theme="dark"]{--bg:#111316;--card:#1b1e23;--text:#f4f5f7;--sub:#bcc2cc;--line:#2c3037;--accent:#8fb0f0;--chip:#252a33;--warn:#f0c060;--bad:#ff8f80;--mark:#7a6a1c}
html{scroll-padding-top:150px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,"PingFang HK","PingFang TC","Noto Sans TC",Arial,sans-serif;font-weight:var(--fw,500)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 12px;background:var(--accent);color:var(--bg);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--chip);color:var(--text);padding:5px 11px;border-radius:999px;font-size:14px;border:1.5px solid rgba(128,128,128,.45)}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#info{font-size:13px;color:var(--sub);margin-top:6px}
main{padding:10px 12px 40px;max-width:820px;margin:0 auto}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;overflow:hidden}
.day h2{margin:0;padding:8px 12px;font-size:15px;font-weight:700;color:var(--accent);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.day h2 span{color:var(--sub);font-weight:400}
.day pre{margin:0;padding:10px 12px;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.day.flash{outline:2px solid var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
#gal{padding:10px 12px 40px;max-width:820px;margin:0 auto}#gal[hidden]{display:none}#gal figure{margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}#gal img{display:block;width:100%;height:auto}#gal figcaption:empty{display:none}#gal figcaption{padding:6px 12px;font-size:14px;color:var(--sub)}#ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto}#ov img{max-width:100%;max-height:100%}.grid{display:flex;gap:6px;align-items:flex-start}.grid .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}#gal .grid figure{margin:0;border-radius:8px}#gal .grid img{height:auto}.chips[hidden]{display:none}#gal .grid figure{position:relative}.badge{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
#bk{margin-top:6px;font-size:14px;font-weight:600;color:var(--warn,#8a5a00);background:rgba(224,176,80,.18);border-radius:8px;padding:5px 10px}#bk[hidden]{display:none}
.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.ph{display:flex;flex-direction:column;gap:8px;flex-basis:100%;min-width:0}.ph img{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;margin:0 auto;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}.phx{padding:14px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:10px}
.lnk{display:inline-block;color:var(--accent);background:var(--chip);border:1.5px solid var(--accent);border-radius:10px;padding:6px 14px;font-weight:600;cursor:pointer}.bdg{font-size:14px;font-weight:600;color:var(--warn,#8a5a00)}.bdg.cf{color:var(--bad,#c0392b)}
.ed{padding:10px 12px}.ed textarea{width:100%;font:inherit;font-size:15.5px;line-height:1.6;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
.ed .bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.alt{margin:0 12px 10px;font-size:14px}.alt pre{padding:8px 0 0!important;font-size:14px!important;color:var(--sub)}
#pn{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
#pn .box{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#pn h3{margin:0 0 10px;font-size:17px}#pn .row2{display:flex;flex-direction:column;gap:8px}#pn textarea{width:100%;height:30vh;font:inherit;font-size:13px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#pn small{color:var(--sub);display:block;margin:6px 0}#pn button.g{background:var(--chip);color:var(--text)}#rem{padding:10px 12px 40px;max-width:820px;margin:0 auto}#rem[hidden]{display:none}.od{color:#c0392b}.rem-note{font-size:14px;color:var(--sub);margin:6px 0 12px}#pn input[type=text],#pn input[type=number],#pn input[type=datetime-local]{width:100%;font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}#pn textarea.rb{height:16vh}#pn .qs{display:flex;flex-wrap:wrap;gap:8px}#pn .qs button{background:var(--chip);color:var(--text)}#pn .qs button.on{background:var(--accent);color:var(--bg)}#list .day{cursor:pointer;-webkit-tap-highlight-color:rgba(143,176,240,.25)}.act:empty{display:none}#lyb{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:820px;margin:0 auto;z-index:6;display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 2px 12px rgba(0,0,0,.25)}#lyb[hidden]{display:none}#lyb .lyt{font-size:14px;color:var(--sub);white-space:nowrap}#lyb .lyy{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto}#lyb button.g{background:var(--chip);color:var(--text);border:1.5px solid rgba(128,128,128,.45);padding:7px 11px}#lyb button.g.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}body.lyon main{padding-bottom:90px}
header{transition:transform .25s ease}header.hide{transform:translateY(calc(-100% - env(safe-area-inset-top,0px) - 2px))}
</style><style id="ui2">
/* ===== UI v2：圖標列 + 拉下菜單 ===== */
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
[hidden]{display:none!important}
html{scroll-padding-top:70px;-webkit-tap-highlight-color:transparent}

/* 圖標 */
.ib svg,.ib2 svg,.lnk svg,.bdg svg,.lyt svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lnk svg{width:18px;height:18px}
.bdg svg{width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:4px}
.ib,#th.ib,#mn.ib{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--sub);transition:background .15s,color .15s}
.ib:active{background:var(--chip)}
.ib.on,#th.ib.on{color:var(--accent);background:var(--chip)}
.ib.pri{width:60px;background:var(--accent);color:var(--bg)}
.ib.dng{color:var(--bad)}
.ib.arm{background:var(--bad);color:#fff}
.ib[data-arm],.ib2[data-arm]{width:auto;padding:0 12px;gap:6px}
[data-arm]::after{content:attr(data-arm);font-size:13px;font-weight:600;white-space:nowrap}
.ib.pend::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
.ib .cnt{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warn);color:var(--bg);font:700 11px/17px -apple-system,Arial,sans-serif;font-style:normal;text-align:center}

/* 頂部欄：只留 圖標，其餘收進拉下菜單 */
header{padding:0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:2px;height:48px;max-width:820px;margin:0 auto}
#info{flex:1;min-width:0;margin:0;padding:0 6px;font-size:14px;line-height:48px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#pdb svg{transition:transform .2s}
header.open #pdb svg{transform:rotate(180deg)}
.srow{display:none;align-items:center;gap:6px;max-width:820px;margin:0 auto;padding:0 0 8px}
header.srch .srow{display:flex}
#q{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:12px;font-size:16px;-webkit-appearance:none;appearance:none}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}

/* 拉下菜單 */
.pdm{position:absolute;left:0;right:0;top:100%;padding:12px 12px 14px;background:var(--bg);border-bottom:1px solid var(--line);border-radius:0 0 20px 20px;box-shadow:0 18px 32px -8px rgba(0,0,0,.35);max-height:calc(100vh - 90px);overflow:auto;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px);transition:opacity .18s,transform .2s,visibility 0s .2s}
header.open .pdm{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .18s,transform .2s}
#scrim{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .2s}
body.pdo #scrim{opacity:1;pointer-events:auto}
.pd-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--chip)}
.seg .ib{flex:1;width:auto;height:40px}
.seg .ib.on{background:var(--accent);color:var(--bg)}
.pdm .chips{margin:0;padding:0;overflow:visible;flex-wrap:wrap}
#chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#chips .chip{text-align:center;padding:8px 0;font-size:14.5px}
#chips .chip:nth-child(n+14){display:none}
#ychips .chip{padding:8px 14px;font-size:14.5px}
.tools{display:flex;gap:6px}
.tools .ib,.tools #th.ib,.tools #mn.ib{flex:1;width:auto;height:44px;background:var(--chip);color:var(--text)}
#bk{margin:0;display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border-radius:12px}
#bk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 日誌卡片 */
main{padding:12px 12px 48px}
.day{border-radius:16px;margin:0 0 12px}
.day.today{box-shadow:inset 3px 0 0 var(--accent)}
.day h2{display:flex;align-items:baseline;justify-content:flex-start;gap:8px;padding:13px 16px 11px;border:0;font-size:15px;font-weight:700;color:var(--accent)}
.day h2 b{font-size:27px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.day h2 span{font-weight:600}
.day h2 .ym,.day h2 .wk,.day h2 span:last-child{font-size:13px;font-weight:500;color:var(--sub)}
.day h2 .wk,.day h2 span:last-child{margin-left:auto}
.day h2 .wk,.day h2 span:last-child{color:var(--accent)}   /* 星期一至五：日子、星期幾都用藍色（年月維持灰色） */
.day.we h2 b,.day.we h2 .wk,.day.we h2 span:last-child{color:var(--bad)}   /* 星期六、日和官方假期：日子、星期幾用紅色 */
.day h2{flex-wrap:wrap;row-gap:2px}   /* 假期名稱放在日期下一橫行 */
.day h2 .hol{order:9;flex:0 0 100%;min-width:0;font-size:13px;font-weight:400;font-style:normal;line-height:1.35;color:var(--bad);white-space:normal;overflow-wrap:anywhere}   /* 假期名稱：正體，紅色（和週末同一個紅）；太長時自動換行，完整顯示 */
.day h2 .ym,.day h2 .wk{flex:none;white-space:nowrap}   /* 年月和星期幾不換行 */
.day h2 .wx{flex:0 1 auto;min-width:0;margin-left:auto;font-size:12px;font-weight:400;line-height:1.35;color:var(--sub);text-align:right;white-space:normal;overflow-wrap:anywhere}   /* 天氣：灰色小字，靠右、貼著星期幾；太長時自動換行 */
.day h2 .wx+.wk{margin-left:0}
.day h2 .wx.fc{font-style:italic}   /* 未來日子的天氣預報：斜體，和已發生的天氣分開 */
.day pre{padding:0 16px 15px;font-size:16px;line-height:1.7}
.act{gap:8px;padding:0 12px 12px;border:0}
.lnk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border-radius:50%}
.bdg{display:inline-flex;align-items:center}

/* 編輯 */
.ed{padding:6px 12px 12px}
.ed textarea{font-size:16px;line-height:1.65;border-radius:12px;padding:12px}
.etools{display:flex;align-items:center;gap:4px;margin:4px 0 8px;min-height:42px}
.etools .rl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.etools .chg{font-size:12.5px;color:var(--sub);margin-left:auto;white-space:nowrap}
.ed .bt{align-items:center;justify-content:flex-end;gap:6px;margin-top:8px;flex-wrap:nowrap}
.ed .bt .dng{margin-right:auto}

/* 面板／相簿按鈕 */
.ib2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:44px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(128,128,128,.35);background:var(--chip);color:var(--text);font:inherit;font-size:15px;font-weight:600}
:is(#pn,body) .ib2.pri,:is(#pn,body) .ib2.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
:is(#pn,body) .ib2.dng{background:transparent;color:var(--bad);border-color:var(--bad)}
:is(#pn,body) .ib2.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
#ov .ib2{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
#ov .ib2.dng{background:rgba(190,50,50,.92);color:#fff;border-color:transparent}
.gbar{display:flex;gap:8px;flex-wrap:wrap}
#pn .box{border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.shd{position:relative;display:flex;justify-content:flex-end;min-height:44px;margin-bottom:4px}
.grab{position:absolute;left:50%;top:2px;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
#pn .row2{gap:10px}
#pn small{margin:8px 0 0;font-size:13px}
#pn .qs{align-items:center}
#pn .qs.end{justify-content:flex-end}
#pn .yr .yl{flex:1;font-size:15px}
.dr{display:flex;gap:8px}
#pn .dr input[type=date]{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}

/* 當年今日小列 */
#lyb{border-radius:18px;padding:6px 8px;gap:4px}
#lyb .lyt{display:inline-flex;align-items:center;color:var(--accent);padding:0 6px}

/* 提示 */
#tst{position:fixed;left:50%;width:max-content;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:40;max-width:min(88vw,520px);padding:10px 16px;border-radius:16px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;line-height:1.45;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#tst.on{opacity:1;transform:translate(-50%,0)}
body.lyon #tst{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#hol{padding:10px 12px 40px;max-width:820px;margin:0 auto}
#hol[hidden]{display:none}
#hol .hm{font-size:14px;font-weight:600;color:var(--sub);margin:16px 0 4px}
#hol .hr{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
#hol .hd{flex:none;width:78px;font-weight:600;color:var(--bad)}
#hol .hn{flex:1;min-width:0;overflow-wrap:anywhere}
#hol .hn small{color:var(--sub);margin-left:6px}
#hol .hl{flex:none;font-size:13px;color:var(--accent);white-space:nowrap}
#hol .hmore{display:block;margin:16px auto 6px;padding:10px 20px;border:0;border-radius:12px;background:var(--chip);color:var(--text);font-size:15px}
.ed textarea:focus{outline:3px solid var(--text);outline-offset:0}   /* 編輯框外框：原本是系統預設藍色，改為白色（夜間）；白天模式自動變深色，才看得見 */
</style><style id="ui3">

:root[data-theme="dark"]{--k1:#8fb0f0;--k2:#5eead4;--k3:#fbbf24;--k4:#fda4af;--k5:#c4b5fd;--k6:#86efac;--on:#0f1216;--pd-bg:#23272e;--pd-bd:#444b57}
#scrim{background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

.pd-in{gap:16px}

/* 檢視／工具：圖標＋文字，各有顏色 */
.seg,.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0;background:none;border-radius:0}
header .seg .ib,header .tools :is(.ib,#th.ib,#mn.ib){flex-direction:column;gap:3px;width:auto;height:62px;padding:0;border-radius:14px;color:var(--c);background:var(--chip);background:color-mix(in srgb,var(--c) 13%,var(--pd-bg));border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent)}
header .seg .ib::after,header .tools .ib::after{content:attr(data-lb);font-size:13px;font-weight:700;line-height:1}
header .seg .ib.on{background:var(--c);color:var(--on);border-color:var(--c)}
#vb1{--c:var(--k1)}#vb2{--c:var(--k2)}#vb3{--c:var(--k3)}#vb4{--c:var(--k4)}
header .tools #th{--c:var(--k3)}header .tools #fz,header .tools #fw{--c:var(--k6)}header .tools #mn{--c:var(--k5)}
header .tools .ib:active,header .seg .ib:active{filter:brightness(.92)}
/* 年份／月份：彩色按鈕，選中時實心 */
.pdm .chip{color:var(--text);font-weight:600;border-radius:12px}

   現在的宿主是 Scriptable 的「日誌」腳本：訊息編成 scriptable:///run?scriptName=日誌&… 網址（hostURL），用 location.href 送出（hostDeliver），由腳本攔截。

 const lim=new Date(now.getFullYear(),now.getMonth()+holMonths,now.getDate()),limS=lim.getFullYear()+'-'+pad2(lim.getMonth()+1)+'-'+pad2(lim.getDate());
 const shown=all.filter(x=>x.d<=limS);let cur='';
 shown.forEach(x=>{const ym=x.d.slice(0,4)+'年'+(+x.d.slice(5,7))+'月';
  if(ym!==cur){cur=ym;const h=document.createElement('div');h.className='hm';h.textContent=ym;holEl.appendChild(h)}
  const left=Math.round((new Date(+x.d.slice(0,4),+x.d.slice(5,7)-1,+x.d.slice(8))-now)/864e5);
  const r=document.createElement('div');r.className='hr';
  const hd=document.createElement('span');hd.className='hd';hd.textContent=(+x.d.slice(8))+'日 '+wkOf(x.d);
  const hn=document.createElement('span');hn.className='hn';
  x.items.forEach((e,i)=>{if(i)hn.appendChild(document.createTextNode('、'));hn.appendChild(document.createTextNode(e.n));const sm=document.createElement('small');sm.textContent=e.t.join('、');hn.appendChild(sm)});
  const hl=document.createElement('span');hl.className='hl';hl.textContent=left<=0?'今天':left===1?'明天':'還有 '+left+' 天';
  r.append(hd,hn,hl);holEl.appendChild(r)});
 if(!shown.length){const n=document.createElement('div');n.className='rem-note';n.textContent='這段時間沒有假期資料。';holEl.appendChild(n)}
 if(shown.length<all.length){const b=document.createElement('button');b.className='hmore';b.textContent='顯示更多';b.onclick=()=>{holMonths+=12;renderHol()};holEl.appendChild(b)}
 const rg=HOLIDAY_SETS.map(k=>{const ks=Object.keys(HOL[k]||{}).sort();return ks.length?(HOLNAME[k]||k)+'到 '+ks[ks.length-1].slice(0,4)+' 年底':''}).filter(Boolean).join('，');
 const nt=document.createElement('div');nt.className='rem-note';nt.textContent='資料範圍：'+rg;holEl.appendChild(nt);
 info.textContent='假期 共 '+shown.length+' 個'}
function showHol(){lyHide();inPhotos=false;inRem=false;inHol=true;list.hidden=true;gal.hidden=true;remEl.hidden=true;holEl.hidden=false;[...chips.children].forEach(c=>c.classList.remove('on'));renderHol();navSync();window.scrollTo(0,0)}
function navSync(){const m={vb1:!inPhotos&&!inRem&&!inHol,vb2:inPhotos,vb3:inRem,vb4:inHol};for(const k in m){const b=document.getElementById(k);if(b)b.classList.toggle('on',m[k])}}
/* 提醒（頂欄）／假期（小菜單）：進去後再按一次，回到離開前看的那一天 */
let backD='';
function topCardDate(){try{if(!list.hidden){for(const e of list.children){if(e.id&&/^d\d{4}-\d{2}-\d{2}$/.test(e.id)&&e.getBoundingClientRect().bottom>80)return e.id.slice(1)}}}catch(x){}return ''}
function leaveList(){if(!inRem&&!inHol&&!inPhotos)backD=topCardDate()}
function backToList(){const d=backD;backD='';if(d&&DATA.some(x=>x[0]===d&&!x[3])){goDay(d);holdLanding(d)}else landToday()}
document.getElementById('vb3').onclick=()=>{pdClose();if(inRem)backToList();else{leaveList();showRem()}};
document.getElementById('vb4').onclick=()=>{pdClose();if(inHol)backToList();else{leaveList();showHol()}};
chips.addEventListener('click',e=>{if(e.target.closest('.chip'))pdClose()});
/* 工具列 */
function fontCycle(){const n=((META.fs??1)+1)%TA.length;META.fs=n;saveMeta();applyFont();toast('文字大小：'+FLAB[n])}
document.getElementById('fz').onclick=fontCycle;
document.getElementById('fw').onclick=()=>{const n=((META.fb??1)+1)%FW.length;META.fb=n;saveMeta();applyFont();toast('字體粗細：'+WLAB[n])};
function uiPend(pn){pdb.classList.toggle('pend',pn>0)}
navSync();
/* 手勢：小菜單上往上滑＝收起；Esc 也可收起 */
(function(){let y1=null;const pm=document.getElementById('pd');
pm.addEventListener('touchstart',e=>{y1=e.touches[0].clientY},{passive:true});
pm.addEventListener('touchmove',e=>{if(y1===null)return;if(y1-e.touches[0].clientY>60&&pm.scrollTop<=0){y1=null;pdClose()}},{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape'){pdClose();if(HD.classList.contains('srch'))closeSearch()}})})();

render();
initEdits();
</script><script>
/* 往下滑（看後面的日子）時頂欄收起；往上滑一下（回頭看）、回到最上面、搜尋中、小菜單打開時顯示。
   一次跳超過 300px（日曆、當年今日、接月份）是程式在跳，不算手指滑動，維持目前狀態 */
(function(){const h=document.querySelector('header'),q=document.getElementById('q');let last=window.scrollY,tick=false,hold=0;
addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;
 const y=window.scrollY,d=y-last,max=document.documentElement.scrollHeight-window.innerHeight;
 if(y<=10||document.activeElement===q||h.classList.contains('open')||h.classList.contains('srch'))h.classList.remove('hide');
 else if(Math.abs(d)>=300){}
 else if(y<max-2&&d>8){if(Date.now()>=hold)h.classList.add('hide')}   /* 剛叫回頂欄的 0.8 秒內不收：Android 收起鍵盤、卡片變矮時會連發幾次捲動事件，不能又把它收掉 */
 else if(y<max-2&&d<-8)h.classList.remove('hide');
 last=y})},{passive:true});
/* 頁面短到滑不動（卡片很少）：沒有滑動事件，頂欄收起後就回不來（Android 沒有 iOS 的橡皮筋回彈）。所以只要滑不動，頂欄就不收；內容、視窗大小變了也重新檢查 */
const fit=()=>{if(h.classList.contains('hide')&&document.documentElement.scrollHeight-window.innerHeight<=10)h.classList.remove('hide')};
window.__hdrFit=fit;window.__hdrShow=()=>{hold=Date.now()+800;h.classList.remove('hide')};
addEventListener('resize',fit);
try{if(window.ResizeObserver)new ResizeObserver(fit).observe(document.body)}catch(e){}
})();
</script>
</body></html>
